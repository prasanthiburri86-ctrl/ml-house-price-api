name: Deploy ML API to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build Docker image
      run: docker build -t ml-api .

    - name: Test container
      run: docker run -d -p 8000:8000 ml-api

